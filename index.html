<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语单词拼写检测</title>
    
    <style>
        :root {
            --bg-color: #F7F7F7;
            --text-color: #4B4B4B;
            --text-secondary: #777777;
            --card-bg: #FFFFFF;
            --border-color: #E5E5E5;
            --input-bg: #FFFFFF;
            --input-border: #E5E5E5;
            --primary-color: #58CC02;
            --primary-hover: #61E002;
            --primary-deep: #46A302;
            --soft-bg: #F0F0F0;
            --sidebar-bg: #FFFFFF;
            --sidebar-hover: #F7F7F7;
            --sidebar-active: #EAF9DC;
            --success-color: #58CC02;
            --danger-color: #FF4B4B;
        }

        [data-theme="dark"] {
            --bg-color: #131F24;
            --text-color: #E8F0F2;
            --text-secondary: #A7B8BF;
            --card-bg: #1E2A33;
            --border-color: #37464F;
            --input-bg: #16222A;
            --input-border: #37464F;
            --primary-color: #58CC02;
            --primary-hover: #61E002;
            --primary-deep: #46A302;
            --soft-bg: #2A3B47;
            --sidebar-bg: #1E2A33;
            --sidebar-hover: #2A3B47;
            --sidebar-active: #2F4A2A;
            --success-color: #58CC02;
            --danger-color: #FF7A7E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Yuanti SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 14px 12px 28px;
            transition: background-color 0.3s, color 0.3s;
        }

        ::selection {
            background: rgba(88, 204, 2, 0.25);
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(28, 176, 246, 0.6);
            outline-offset: 2px;
        }

        .header {
            text-align: center;
            font-size: clamp(24px, 5vw, 34px);
            font-weight: 900;
            letter-spacing: 0.02em;
            color: var(--primary-deep);
            margin: 6px auto 14px;
            max-width: 880px;
        }

        .control-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin: 0 auto 18px;
            max-width: 880px;
            padding: 18px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(43, 33, 24, 0.06);
            transition: background 0.3s;
        }

        .control-bar>* {
            flex-shrink: 0;
        }

        .time-display {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            width: 100%;
            margin-bottom: 6px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.12);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .mode-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            width: 100%;
            justify-content: center;
        }

                        .daily-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .daily-table th, .daily-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #e5e5e5; }
        .daily-table th { color: #777; font-weight: 700; background: #f7f7f7; }
        .daily-table tr.today-row td { background: #eef9e6; font-weight: 700; }
        .rate-good { color: #46A302; font-weight: 800; }
        .rate-mid { color: #e89c00; font-weight: 800; }
        .rate-bad { color: #FF4B4B; font-weight: 800; }
        .daily-today { background: #f0f9ff; border: 1px solid #bde3ff; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; line-height: 1.9; }
        .textbook-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 10px; }
        .textbook-label { font-weight: 700; color: var(--text-main, #4B4B4B); margin-right: 2px; }
        .tb-btn { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 16px; border-radius: 12px; border: 2px solid #58CC02; background: #fff; color: #46A302; font-weight: 800; font-size: 18px; cursor: pointer; min-height: 44px; box-shadow: 0 3px 0 #46A302; font-family: inherit; }
        .tb-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #46A302; }
        .tb-sub { font-size: 11px; font-weight: 600; color: #98a2a3; }
        .mode-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            min-height: 44px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
        }

        .word-stats {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px 10px;
            border-radius: 999px;
            font-weight: 700;
            background: var(--soft-bg);
        }

        .stat-badge.wrong {
            color: #FF4B4B;
            background: #FFE8E8;
        }

        .stat-badge.correct {
            color: #46A302;
            background: #EAF9DC;
        }

        [data-theme="dark"] .stat-badge.wrong {
            color: #FF9C9F;
            background: #4A2C2C;
        }

        [data-theme="dark"] .stat-badge.correct {
            color: #7ED957;
            background: #274435;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--soft-bg);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            filter: brightness(0.97);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-status {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 5px;
            width: 100%;
        }

        .container {
            background: transparent;
            border-radius: 0;
            box-shadow: none;
            overflow: visible;
            max-width: 880px;
            margin: 0 auto;
            transition: background 0.3s;
        }

        @keyframes itemIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .word-item {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 18px;
            box-shadow: 0 2px 10px rgba(43, 33, 24, 0.06);
            padding: 22px 18px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: itemIn 0.25s ease both;
        }

        .word-item:last-child {
            margin-bottom: 0;
        }

        .chinese-text {
            font-size: 21px;
            font-weight: 800;
            line-height: 1.45;
            color: var(--text-color);
            text-align: left;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-box {
            flex: 1;
            min-width: 0;
            padding: 14px 16px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.04em;
            color: var(--text-color);
            border: 3px solid var(--input-border);
            border-radius: 14px;
            background-color: var(--input-bg);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .input-box::placeholder {
            color: #BDBDBD;
            font-weight: 500;
        }

        .input-box:focus {
            border-color: var(--primary-color);
            background-color: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(88, 204, 2, 0.22);
        }

        .check-icon {
            font-size: 28px;
            min-width: 34px;
            text-align: center;
            display: none;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }

        .btn-icon {
            min-width: 48px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: none;
            cursor: pointer;
            transition: transform 0.08s ease, background-color 0.2s ease;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15), 0 2px 6px rgba(43, 33, 24, 0.12);
        }

        .btn-icon:active {
            transform: translateY(2px);
        }

        .btn-sound {
            background-color: #1CB0F6;
            color: white;
        }

        .btn-sound:hover {
            filter: brightness(1.06);
        }

        .btn-spell {
            background-color: #FFC800;
            color: #5B4300;
        }

        .btn-spell:hover {
            background-color: #F0B400;
        }

        .pagination {
            margin-top: 16px;
            padding: 16px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 18px;
            box-shadow: 0 2px 10px rgba(43, 33, 24, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pagination:empty {
            display: none;
        }

        .pagination button {
            min-width: 44px;
            min-height: 44px;
            padding: 6px 12px;
            border: 2px solid var(--border-color);
            border-radius: 999px;
            cursor: pointer;
            background-color: var(--card-bg);
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            transition: all 0.2s;
        }

        .pagination button.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .pagination button:hover:not(.active) {
            background-color: var(--sidebar-hover);
        }

        .fullscreen-spell {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(19, 31, 36, 0.97);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-wrap: wrap;
            padding: 20px;
        }

        .spell-letter {
            color: #FFC800;
            font-weight: bold;
            font-size: clamp(40px, 12vw, 100px);
            margin: 0 clamp(5px, 2vw, 20px);
            opacity: 0;
            position: relative;
            animation: letterAppear 0.5s forwards;
        }

        @keyframes letterAppear {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .close-spell {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.16);
            border: none;
            color: white;
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(19, 31, 36, 0.5);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 12px 40px rgba(30, 22, 14, 0.25);
            animation: slideUp 0.3s ease-out;
            color: var(--text-color);
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .modal-text {
            color: var(--text-secondary);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Library Sidebar */
        .library-drawer {
            position: fixed;
            left: -300px;
            top: 0;
            width: 280px;
            height: 100%;
            background: var(--sidebar-bg);
            box-shadow: 4px 0 24px rgba(30, 22, 14, 0.15);
            z-index: 1500;
            transition: left 0.3s ease;
            padding: 22px;
            display: flex;
            flex-direction: column;
            color: var(--text-color);
        }

        .library-drawer.open {
            left: 0;
        }

        .library-header {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-color);
        }

        .library-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .library-item {
            padding: 12px;
            margin-bottom: 4px;
            border-radius: 12px;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 15px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .library-item:hover {
            background-color: var(--sidebar-hover);
            color: var(--primary-color);
        }

        .library-item.active {
            background-color: var(--sidebar-active);
            color: var(--primary-color);
            font-weight: bold;
            border-left: 3px solid var(--primary-color);
        }

        .library-toggle {
            position: fixed;
            left: 16px;
            top: 16px;
            z-index: 1400;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(43, 33, 24, 0.12);
            color: var(--text-color);
            font-size: 19px;
        }

        .library-toggle:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            right: 16px;
            top: 16px;
            z-index: 1400;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(43, 33, 24, 0.12);
            font-size: 20px;
        }

        /* ========== Mobile Responsive Styles ========== */
        @media (max-width: 768px) {
            body {
                padding: 10px 8px 24px;
            }

            h1 {
                font-size: 22px;
                padding: 12px;
            }

            .control-bar {
                padding: 14px 12px;
                flex-direction: column;
                align-items: stretch;
            }

            .control-bar>* {
                width: 100%;
                margin-bottom: 8px;
            }

            .control-bar>*:last-child {
                margin-bottom: 0;
            }

            .mode-bar {
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
            }

            .mode-btn {
                font-size: 14px;
                padding: 7px 13px;
            }

            .file-input-wrapper {
                width: 100%;
            }

            .file-status {
                font-size: 12px;
            }

            .user-profile {
                flex-direction: column;
                align-items: stretch !important;
                gap: 5px;
                width: 100%;
            }

            .user-profile span {
                font-size: 13px;
                text-align: center;
            }

            .user-profile button {
                width: 100%;
            }

            #loginBtn {
                width: 100% !important;
                margin: 5px 0 !important;
            }

            .container {
                padding: 0;
            }

            .word-item {
                padding: 18px 14px;
            }

            .word-card {
                padding: 15px;
                margin: 10px 0;
            }

            .word-main {
                font-size: 24px;
            }

            .phonetic {
                font-size: 15px;
            }

            .chinese {
                font-size: 17px;
            }

            .chinese-text {
                font-size: 19px;
            }

            .input-box {
                font-size: 18px;
                padding: 12px 14px;
            }

            .fullscreen-spell {
                padding: 20px;
            }

            #spellWord {
                font-size: 34px;
            }

            #spellPrompt {
                font-size: 15px;
            }

            #spellInput {
                font-size: 19px;
                padding: 12px;
            }

            .spell-hint {
                font-size: 13px;
            }

            .modal-card {
                width: 95% !important;
                max-width: 95% !important;
                margin: 10px;
                padding: 22px 18px;
            }

            .modal-title {
                font-size: 19px;
            }

            .modal-text {
                font-size: 15px;
            }

            .btn {
                font-size: 14px;
                padding: 9px 16px;
            }

            .btn-logout {
                font-size: 13px;
                padding: 6px 12px;
            }

            .pagination {
                padding: 12px 10px;
                gap: 6px;
            }

            .pagination button {
                min-width: 42px;
                min-height: 44px;
                font-size: 14px;
            }

            

            

            #helpModal .modal-card {
                font-size: 15px;
                line-height: 1.7;
            }

            #helpModal h3 {
                font-size: 17px;
            }

            #helpModal li {
                font-size: 14px;
            }

            #adminPanelBtn {
                margin-left: 0 !important;
            }
        }

        /* Extra small devices (phones in portrait) */
        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            .mode-btn {
                font-size: 13px;
                padding: 6px 11px;
            }

            .word-main {
                font-size: 22px;
            }

            .action-buttons {
                justify-content: center;
            }

            .btn-icon {
                width: 46px;
                height: 46px;
                font-size: 18px;
            }

            .spell-letter {
                margin: 0 clamp(2px, 1vw, 10px);
            }

            #spellWord {
                font-size: 30px;
            }

            .btn {
                font-size: 14px;
                padding: 8px 14px;
            }

            .modal-card {
                padding: 20px 16px;
            }
        }

        /* Landscape mode adjustments */
        @media (max-height: 500px) and (orientation: landscape) {
            .fullscreen-spell {
                padding: 10px;
            }

            #spellWord {
                font-size: 26px;
            }

            #spellInput {
                padding: 8px;
            }
        }

        /* Review badge + dictation */
        .mode-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: #FF4B4B;
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            pointer-events: none;
        }

        .dictation-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-listen {
            width: 72px;
            height: 72px;
            min-width: 72px;
            border-radius: 50%;
            border: none;
            background: #1CB0F6;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 3px 8px rgba(75, 75, 75, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.08s ease;
        }

        .btn-listen:active {
            transform: translateY(2px);
        }

        .dictation-side {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
        }

        .dictation-tip {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .peek-btn {
            background: none;
            border: none;
            color: #1CB0F6;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            padding: 4px 0;
            min-height: 32px;
        }
    
        /* ===== Layout polish: even grids + tablet (iPad) adaptation ===== */
        .mode-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; justify-content: stretch; }
        .mode-bar > button { width: 100%; margin-left: 0 !important; }
        .textbook-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 8px 0 14px; align-items: stretch; }
        .textbook-label { grid-column: 1 / -1; font-size: 17px; font-weight: 800; }
        .tb-btn { width: 100%; }
        #wordList > div:only-child { grid-column: 1 / -1; }
        @media (min-width: 768px) {
            .container { max-width: 1080px; padding: 30px 34px; }
            .header { font-size: 34px; }

    <script>
        let allWordData = []; // Store complete dataset
        let displayData = []; // Store filtered data for display
        let currentPage = 1;
        let spellTimeout;
        let currentMode = 'all'; // 'all', 'new', 'mistake'
        const WORDS_PER_PAGE = 3;
        const youdaoAPI = 'https://dict.youdao.com/dictvoice?audio=';

        // Base64 Simple Ding Sound
        const correctSoundBase64 = "data:audio/wav;base64,UklGRl9vTNEAAXdvYmtuPgPNEDYAAA..."; // Placeholder for short ding, let's use a real short base64 or a free url? 
        // Using a short beep URL for simplicity to avoid huge file, or generated one.
        // Actually, best to use a web audio API oscillator for zero-dependency "ding".

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        function playCorrectSound() {
            // Cheerful "pop" arpeggio: notes bounce up C5 -> E5 -> G5 -> C6
            try {
                if (audioContext.state === 'suspended') audioContext.resume();
                const t = audioContext.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, i) => {
                    const osc = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    osc.type = 'triangle';
                    const start = t + i * 0.07;
                    osc.frequency.setValueAtTime(freq * 0.75, start);
                    osc.frequency.exponentialRampToValueAtTime(freq, start + 0.06);
                    gainNode.gain.setValueAtTime(0.0001, start);
                    gainNode.gain.exponentialRampToValueAtTime(0.25, start + 0.02);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, start + 0.24);
                    osc.start(start);
                    osc.stop(start + 0.26);
                });
            } catch (e) { console.log('Sound error:', e); }
        }

        // --- Persistence Manager ---
        const DataPersistence = {
            save(filename, content) {
                try {
                    localStorage.setItem('last_csv_filename', filename);
                    localStorage.setItem('last_csv_content', content);
                } catch (e) { console.error('Storage full?', e); }
            },

            load() {
                const filename = localStorage.getItem('last_csv_filename');
                const content = localStorage.getItem('last_csv_content');
                if (filename && content) {
                    return { filename, content };
                }
                return null;
            },

            savePage(page) {
                localStorage.setItem('last_page', page);
            },

            loadPage() {
                return parseInt(localStorage.getItem('last_page') || 1);
            }
        };

        // --- Stats Manager ---
        const WordStats = {
            storageKey: 'word_spelling_stats',
            data: {},

            init() {
                const stored = localStorage.getItem(this.storageKey);
                if (stored) {
                    this.data = JSON.parse(stored);
                }
            },

            save() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.data));
            },

            get(word) {
                return this.data[word] || { correct: 0, wrong: 0, lastPracticed: 0 };
            },

            update(word, isCorrect) {
                if (!this.data[word]) {
                    this.data[word] = { correct: 0, wrong: 0, lastPracticed: 0 };
                }
                const stat = this.data[word];
                if (isCorrect) stat.correct++;
                else stat.wrong++;
                stat.lastPracticed = Date.now();
                this.save();
                if (typeof WordSRS !== 'undefined') WordSRS.record(word, isCorrect);
                if (typeof DailyLog !== 'undefined') DailyLog.record(word, isCorrect);
            }
        };

        // --- Spaced Repetition (今日复习) ---
        const WordSRS = {
            storageKey: 'word_spelling_srs',
            data: {},
            intervals: [1, 2, 4, 7, 15, 30],

            init() {
                try {
                    this.data = JSON.parse(localStorage.getItem(this.storageKey) || '{}');
                } catch (e) {
                    this.data = {};
                }
            },

            save() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.data));
            },

            startOfDay(ts) {
                const d = new Date(ts);
                d.setHours(0, 0, 0, 0);
                return d.getTime();
            },

            get(word) {
                if (this.data[word]) return this.data[word];
                // Words practiced before SRS existed: derive a schedule from their stats
                const st = WordStats.get(word);
                if (st.correct === 0 && st.wrong === 0) return null;
                let level = 0;
                if (st.wrong === 0 && st.correct >= 3) level = 3;
                else if (st.correct >= 2) level = 2;
                else if (st.correct >= 1) level = 1;
                const rec = {
                    level: level,
                    due: this.startOfDay(st.lastPracticed || Date.now()) + this.intervals[level] * 86400000
                };
                this.data[word] = rec;
                this.save();
                return rec;
            },

            record(word, isCorrect) {
                let rec = this.data[word] || { level: 0, due: 0 };
                if (isCorrect) {
                    rec.due = this.startOfDay(Date.now()) + this.intervals[Math.min(rec.level, this.intervals.length - 1)] * 86400000;
                    rec.level = Math.min(rec.level + 1, this.intervals.length - 1);
                } else {
                    rec.level = 0;
                    rec.due = this.startOfDay(Date.now()) + 86400000;
                }
                this.data[word] = rec;
                this.save();
            },

            dueWords() {
                const endToday = this.startOfDay(Date.now()) + 86400000;
                return allWordData
                    .filter(w => {
                        const r = this.get(w.english);
                        return r && r.due < endToday;
                    })
                    .sort((a, b) => this.get(a.english).due - this.get(b.english).due);
            }
        };
        WordSRS.init();

        function updateReviewBadge() {
            const badge = document.getElementById('reviewBadge');
            if (!badge || typeof allWordData === 'undefined' || !allWordData.length) return;
            const count = WordSRS.dueWords().length;
            badge.textContent = count;
            badge.style.display = count > 0 ? 'inline-flex' : 'none';

        function renderPagination() {
            const totalPages = Math.ceil(displayData.length / WORDS_PER_PAGE);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            // 上一页按钮
            if (currentPage > 1) {
                const prevButton = document.createElement('button');
                prevButton.innerHTML = '‹ 上一页';
                prevButton.addEventListener('click', () => {
                    renderPage(currentPage - 1);
                    renderPagination();
                });
                pagination.appendChild(prevButton);
            }

            // 页码按钮（显示当前页前后各2页）
            const start = Math.max(1, currentPage - 2);
            const end = Math.min(totalPages, currentPage + 2);

            if (start > 1) {
                const firstButton = document.createElement('button');
                firstButton.textContent = '1';
                firstButton.addEventListener('click', () => {
                    renderPage(1);
                    renderPagination();
                });
                pagination.appendChild(firstButton);

                if (start > 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.style.padding = '0 10px';
                    pagination.appendChild(ellipsis);
                }
            }

            for (let i = start; i <= end; i++) {
                const button = document.createElement('button');
                button.textContent = i;
                button.classList.toggle('active', i === currentPage);
                button.addEventListener('click', () => {
                    renderPage(i);
                    renderPagination();
                });
                pagination.appendChild(button);
            }

            if (end < totalPages) {
                if (end < totalPages - 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.style.padding = '0 10px';
                    pagination.appendChild(ellipsis);
                }

                const lastButton = document.createElement('button');
                lastButton.textContent = totalPages;
                lastButton.addEventListener('click', () => {
                    renderPage(totalPages);
                    renderPagination();
                });
                pagination.appendChild(lastButton);
            }

            // 下一页按钮
            if (currentPage < totalPages) {
                const nextButton = document.createElement('button');
                nextButton.innerHTML = '下一页 ›';
                nextButton.addEventListener('click', () => {
                    renderPage(currentPage + 1);
                    renderPagination();
                });
                pagination.appendChild(nextButton);
            }
        }

        function checkSpelling(input, correctWord, icon) {
            const userInput = input.value.trim().toLowerCase();
            const correct = correctWord.toLowerCase();

            // Prevent duplicate stats update for same input session?
            // Simple logic: update on first success or failure per focus session?
            // For simplicity: update on every change that matches result? No, that's too much.
            // Better: Update only when user hits Enter? Or just rely on visual feedback?
            // User requirement: "自动记录". Usually means when they get it right or wrong.
            // To avoid spamming stats while typing:
            // 1. Only mark correct when exact match.
            // 2. Mark wrong? Hard to define "finished typing wrong".
            // Let's stick to: If they enter correct word -> Correct ++.
            // If they give up/check answer (not implemented yet) -> Wrong ++.
            // Current code is oninput.
            // Let's add a "checked" flag to the input element to avoid double counting?

            if (userInput === correct) {
                if (!input.dataset.solved) {
                    WordStats.update(correctWord, true);
                    input.dataset.solved = "true";
                    playCorrectSound(); // Play Ding!
                    // Refresh stats view? No, might re-render and lose focus. 
                    // Let's just update backend. Next render will show it.
                }

                icon.innerHTML = "✅";
                icon.style.color = "green";
                icon.style.display = "inline";
                input.style.borderColor = "#28a745";
                input.style.backgroundColor = "#d4edda";
            } else if (userInput === '') {
                icon.style.display = "none";
                input.style.borderColor = "#ddd";
                input.style.backgroundColor = "#fafafa";
            } else {
                // Check if it's a "complete" attempt? 
                // Difficult to know oninput. 
                // Maybe we only count WRONG when they click "Next" or "Reveal"?
                // Or we can add an explicit "Check" button?
                // The current UI is real-time. 
                // Let's NOT count "Wrong" on simple typos while typing.
                // We will count "Wrong" if they use the "Spell" (Show Answer) button.

                icon.innerHTML = "❌";
                icon.style.color = "red";
                icon.style.display = "inline";
                input.style.borderColor = "#dc3545";
                input.style.backgroundColor = "#f8d7da";
            }
        }

        function playSound(word) {
            let fellBack = false;
            let audio = null;
            const fallback = () => {
                if (fellBack) return;
                fellBack = true;
                try { if (audio) audio.pause(); } catch (e) {}
                speakFallback(word);
            };
            try {
                audio = new Audio(`${youdaoAPI}${encodeURIComponent(word)}&type=1`);
                audio.volume = 1;
                audio.addEventListener('error', fallback);
                const p = audio.play();
                if (p && p.catch) p.catch(() => fallback());
                setTimeout(() => { if (!fellBack && audio && audio.readyState < 2) fallback(); }, 2500);
            } catch (e) {
                fallback();
            }
        }
        function speakFallback(text) {
            try {
                if (!('speechSynthesis' in window)) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.volume = 1;
                u.rate = 0.95;
                const vs = speechSynthesis.getVoices();
                for (let i = 0; i < vs.length; i++) { if (/^en[-_]/i.test(vs[i].lang)) { u.voice = vs[i]; break; } }
                speechSynthesis.speak(u);
            } catch (e) {}
        }

        function loadByPages() {

            if (isNaN(from)) from = b.units[0].start;
            if (isNaN(to)) to = b.units[b.units.length - 1].end;
            if (from > to) { var tmp = from; from = to; to = tmp; }
            var hit = b.units.filter(function(u) { return u.start <= to && u.end >= from; });
            if (!hit.length) { alert('第 ' + from + '–' + to + ' 页没有对应的单元单词（这册课文页是第 ' + b.units[0].start + '–' + b.units[b.units.length - 1].end + ' 页）'); return; }

                var zh = (parts[1] || '').trim();

                list.push({ en: en, zh: zh });

        function mergeCSVStrings(list) {

                    var k = line.split(',')[0].trim().toLowerCase();

            var part = (p.part === 0) ? 0 : 1;
            var csvList = [];
            for (var i = 0; i < last; i++) csvList.push(b.units[i].csv);
            csvList.push(part === 1 ? b.units[last].csv : b.units[last].parts[0].csv);

        function maskWord(word, level) {
            return word.split(' ').map(function(part) {
                var out = '';
                for (var i = 0; i < part.length; i++) {
                    var show = false;
                    if (level === 1) show = i === 0;
                    else if (level === 2) show = i % 2 === 0;
                    else show = i < part.length - 1;
                    out += show ? part[i] : '_';
                }
                return out.split('').join(' ');
            }).join('   ');
        }
        function showHint(btn, word) {
            var card = btn.closest('.word-item');
            var line = card.querySelector('.hint-line');
            var lv = parseInt(line.getAttribute('data-lv') || '0', 10) + 1;
            if (lv > 3) lv = 1;
            line.setAttribute('data-lv', lv);
            line.innerText = '💡 提示 ' + lv + '/3：' + maskWord(word, lv);
            line.style.display = 'block';
        }
        function toggleExample(btn, word) {
            var card = btn.closest('.word-item');
            var line = card.querySelector('.ex-line');
            if (line.style.display === 'block') { line.style.display = 'none'; return; }
            var ex = EXAMPLES[String(word).toLowerCase()];

            else {
                var s = ex[0];
                var idx = s.toLowerCase().indexOf(String(word).toLowerCase());

                line.innerText = '📖 ' + s + '（' + ex[1] + '）';
            }
            line.style.display = 'block';
        }

                }
            };
            reader.readAsText(file);
        }
    </script>

<div id="printModal" class="print-modal" onclick="if(event.target===this)closePrintModal()">
    <div class="print-modal-box">
        <h2>🖨️ 打印</h2>
        <p id="printModalInfo"></p>
        <button class="print-opt" onclick="doPrintChoice('study')">📖 学习版：英文 + 中文（复习、贴墙看）</button>
        <button class="print-opt" onclick="doPrintChoice('dictation')">✍️ 听写版：看中文写英文（带姓名、日期栏）</button>
        <button class="print-opt" onclick="closePrintModal()">取消</button>
    </div>
</div>
<div id="printArea"></div>
</body>
